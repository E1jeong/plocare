name: Deploy web demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build web demo
        run: |
          chmod +x gradlew
          ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --max-workers=1

      - name: Assemble Pages site
        run: |
          mkdir -p build/pages/demo
          cp docs/*.html docs/favicon.ico docs/favicon.png docs/favicon-16.png docs/favicon.svg docs/apple-touch-icon.png build/pages/
          cp -R webApp/build/dist/wasmJs/productionExecutable/. build/pages/demo/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
